# Builds the Arch, Debian, Fedora and Flatpak packages and checks the Nix
# one; on a v* tag, publishes them as a GitHub release with their SHA-256
# sums. Run it by hand (Actions → release → Run workflow) to build the
# packages as artifacts without publishing.
#
# The version is Cargo.toml's. A tag must match it, and the metainfo must
# have a <release> for it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$v" >>"$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but Cargo.toml says $v"; exit 1
          fi
          grep -q "<release version=\"$v\"" packaging/linux/dev.antoniosarro.ProtonHub.metainfo.xml ||
            { echo "::error::the metainfo has no <release> for $v"; exit 1; }

  arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel rust gtk4 libadwaita gettext systemd-libs
      - uses: actions/checkout@v7
      # makepkg refuses to run as root.
      - run: |
          useradd -m builder
          chown -R builder .
          su builder -c 'packaging/build.sh arch'
      - uses: actions/upload-artifact@v7
        with: { name: arch, path: dist/* }

  deb:
    needs: version
    runs-on: ubuntu-latest
    # The oldest supported Debian, so the .deb installs on newer ones and
    # Ubuntu too; its Rust is too old, so rustup's.
    container: debian:trixie
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper pkgconf \
            libgtk-4-dev libadwaita-1-dev libudev-dev gettext ca-certificates curl
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      - uses: actions/checkout@v7
      # -d: the toolchain is rustup's, not the cargo package.
      - run: packaging/build.sh deb -d
      - uses: actions/upload-artifact@v7
        with: { name: deb, path: dist/* }

  rpm:
    needs: version
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: >
          dnf -y install rpm-build cargo gcc 'pkgconfig(gtk4)' 'pkgconfig(libadwaita-1)'
          'pkgconfig(libudev)' gettext desktop-file-utils libappstream-glib
      - uses: actions/checkout@v7
      - run: packaging/build.sh rpm
      - uses: actions/upload-artifact@v7
        with: { name: rpm, path: dist/* }

  flatpak:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/checkout@v7
      - run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --repo=repo build packaging/flatpak/dev.antoniosarro.ProtonHub.yml
          mkdir -p dist
          flatpak build-bundle repo "dist/ProtonHub-${{ needs.version.outputs.version }}.flatpak" \
            dev.antoniosarro.ProtonHub
      - uses: actions/upload-artifact@v7
        with: { name: flatpak, path: dist/* }

  nix:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build .#default -L

  publish:
    if: github.ref_type == 'tag'
    needs: [version, arch, deb, rpm, flatpak, nix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum -- * >SHA256SUMS
      - run: >
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --title "ProtonHub ${{ needs.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
