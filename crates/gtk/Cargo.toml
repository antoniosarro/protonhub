[package]
name = "protonhub-gtk"
description = "The protonhub GUI, in GTK 4 and libadwaita"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "protonhub-gtk"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel = "2.5.0"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gilrs = "0.11.2"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
protonhub-core.workspace = true
regex.workspace = true
