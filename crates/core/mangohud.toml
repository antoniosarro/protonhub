# The MangoHud settings its editor offers, in groups. `default` is what
# MangoHud does without the line (MangoHud 0.8, src/overlay_params.cpp); a
# setting at its default is left out of the file. Kinds: `switch` (written
# as `key` or `key=0`), `number` (with `min`, `max` and `step`), `choice`
# (one of `choices`), `color` (RRGGBB) and `text`. A group of `elements`
# is things the HUD shows: with `legacy_layout=0`, MangoHud shows only those
# listed, in their order, whatever their default.

[[group]]
title = "Metrics"
elements = true

[[group.setting]]
key = "fps"
name = "Frame Rate"
kind = "switch"
default = "1"

[[group.setting]]
key = "frametime"
name = "Frame Time"
description = "Milliseconds per frame, beside the frame rate"
kind = "switch"
default = "1"

[[group.setting]]
key = "frame_timing"
name = "Frame Time Graph"
kind = "switch"
default = "1"

[[group.setting]]
key = "histogram"
name = "Graph as Bars"
description = "The frame time graph as a histogram"
kind = "switch"
default = "0"

[[group.setting]]
key = "show_fps_limit"
name = "Current Frame Rate Limit"
kind = "switch"
default = "0"

[[group.setting]]
key = "gpu_stats"
name = "GPU Load"
