# Wine builds: for Lutris, Heroic, Bottles and WineZGUI.
# Schema: docs/manifests.md

[wine-ge]
name      = "Wine-GE"
source    = { github = "GloriousEggroll/wine-ge-custom" }
# The repository also publishes the LoL builds (GE-Proton8-27-LoL), as
# releases of their own.
tag       = '^GE-Proton[0-9]+-[0-9]+$'
asset     = { x86_64 = '^wine-lutris-GE-Proton[0-9]+-[0-9]+-x86_64\.tar\.xz$' }
checksum  = { pattern = "{asset_stem}.sha512sum", algo = "sha512" }
launchers = { lutris = "runners/wine", heroic = "tools/wine", bottles = "runners", winezgui = "Runners" }

[lutris-wine]
name      = "Lutris-Wine"
source    = { github = "lutris/wine" }
# Not the LoL builds (lutris-ge-lol-6.16-4).
tag       = '^lutris-(wine-)?[0-9]'
asset     = { x86_64 = '^wine-lutris-[0-9][0-9.-]*-x86_64\.tar\.xz$' }
launchers = { lutris = "runners/wine", bottles = "runners", winezgui = "Runners" }

[kron4ek-wine]
name      = "Kron4ek Wine (vanilla)"
source    = { github = "Kron4ek/Wine-Builds" }
# The plain amd64 build; each release also has staging, tkg, wow64 and x86.
asset     = { x86_64 = '^wine-[0-9][0-9.]*-amd64\.tar\.xz$' }
checksum  = { pattern = "sha256sums.txt", algo = "sha256" }
launchers = { lutris = "runners/wine", bottles = "runners", winezgui = "Runners" }
